format: custom-json
note: >-
  Neither FERC API uses RFC 9457 problem+json. Two different error envelopes are in play, one per
  API. The Open Data API sits behind the api.data.gov API Umbrella gateway, whose envelope is
  `{"error":{"code":"...","message":"..."}}`; the OpenAPI's documented 401 for auth failure is
  contradicted by the live gateway, which returns 403 with API_KEY_MISSING / API_KEY_INVALID. The
  eForms API returns an ASP.NET Web API envelope, `{"message":"..."}` or `{"error":"..."}`.
envelopes:
  - api: ferc:ferc-open-data-api
    shape: '{"error": {"code": "STRING", "message": "STRING"}}'
    content_type: application/json
    gateway: api.data.gov API Umbrella (cloud.gov)
    correlation_header: x-api-umbrella-request-id
  - api: ferc:ferc-eforms-xbrl-submission-api
    shape: '{"message": "STRING"} or {"error": "STRING"}'
    content_type: application/json
    stack: ASP.NET Web API
