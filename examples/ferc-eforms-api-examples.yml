request_examples:
  - name: Obtain a filer bearer token
    operationId: getFilerToken
    source: collections/ferc-xbrl-submission-api.postman_collection.json
    curl: >-
      curl -X POST "https://ecollection.ferc.gov/api/token" -H "Content-Type:
      application/x-www-form-urlencoded" -d "username=<filer-username>@company.com"
      -d "password=<filer-password>" -d "grant_type=password" -d "role=filer"
  - name: Submit a test XBRL filing
    operationId: postExternalFiling
    source: collections/ferc-xbrl-submission-api.postman_collection.json
    curl: >-
      curl -X POST "https://ecollection.ferc.gov/api/SubmissionHistory/ExternalFiling"
      -H "Authorization: Bearer <token>" -F "zipFiling=@filing.zip" -F "cid=C006939"
      -F "reportYear=2026" -F "reportPeriod=Q4" -F "email=filer@company.com" -F "form=1"
      -F "test=true" -F "additionalNotes=This is a test submission"
    note: >-
      Placeholders only. Not executed — this writes to FERC's production filing system. Form
      identifier mapping is published in FERC's step-by-step guide; see
      openapi/ferc-eforms-api-openapi-derived.yml.
