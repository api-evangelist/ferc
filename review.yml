specDefects:
- spec: openapi/ferc-data-api-openapi.json
  issue: 'Declares "openapi": "3.0.0" but uses Swagger 2.0 root fields — "host",

    "schemes" — instead of the OpenAPI 3 "servers" array. There is no servers

    block at all, so no OpenAPI 3 tooling can resolve a base URL from this

    document.

    '
- spec: openapi/ferc-data-api-openapi.json
  issue: 'The "host" value is "https://api-staging.data.ferc.gov/v1" — a STAGING

    host — while FERC''s own API Key Usage documentation and every working example

    use the production host https://api.data.ferc.gov/v1. The published contract

    points developers at staging.

    '
- spec: openapi/ferc-data-api-openapi.json
  issue: 'securitySchemes declares only ApiKeyQueryAuth (api_key in query). The

    documented and RECOMMENDED X-Api-Key header scheme is absent from the spec.

    '
- spec: openapi/ferc-data-api-openapi.json
  issue: 'Response schemas are typed only as generic arrays of untyped objects

    carrying "example" blobs — no properties, no named components, no $refs. The

    spec describes shape by example rather than by schema.

    '
- spec: openapi/ferc-data-api-openapi.json
  issue: info has no version field, and the description contains a typo
    ("documentaiton").
- spec: openapi/ferc-data-api-openapi.json
  issue: 'x-logo points at "/public/logo512.png", which returns HTTP 404 on

    data.ferc.gov.

    '
