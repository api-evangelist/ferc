actions:
  openapiHarvested: true
  specsCount: 2
  collectionsHarvested: 1
  apisYmlCreated: true
  reason: 'FERC has a real, self-serve, documented public API with a downloadable

    OpenAPI, plus a second credentialed write API with a downloadable Postman

    collection. Both were probed live and both artifacts were harvested verbatim.

    No consumer energy data surface exists and none was invented.

    '
