aid: ferc
name: FERC
review:
  question: Does FERC publish a real, documented, publicly accessible API — and does
    any consumer energy data mandate apply to or originate from it?
  answer: true
  date: '2026-07-27'
  reviewer: API Evangelist
  homeMarket: United States
  tier: regulator
findings:
  summary: 'FERC publishes a genuine, well-documented, self-serve open data API at

    https://api.data.ferc.gov/v1, described by a real OpenAPI 3.0 document served

    at https://data.ferc.gov/openapi.json, plus a separate credentialed OAuth2

    XBRL submission API at https://ecollection.ferc.gov/api for mandated eForms

    filings. FERC publishes NO consumer energy data API of any kind and imposes

    no consumer data obligation on anyone, because retail customer data sits with

    the fifty state public utility commissions, not with FERC. The split is

    absolute: market and regulatory data is open behind a free key; consumer data

    does not exist in FERC''s surface at all.

    '
mandateAndAccess:
  homeMarket: United States
  mandateRegime: other
  mandateRegimeVerbatim: 'FERC imposes its own statutory data-reporting mandates on

    the wholesale industry it regulates, and none of them is a consumer data

    right. The obligations are: Electric Quarterly Reports (EQR), required of

    public utilities with market-based rate authority; and the eForms annual and

    quarterly financial and operational filings — FERC Form Nos. 1, 2, 3-Q, 6,

    60, 552, and 714 — which must be submitted as XBRL through FERC''s eForms

    portal or its Submission API by a credentialed filer. FERC also incorporates

    NAESB Wholesale Gas Quadrant and Wholesale Electric Quadrant business

    practice standards by reference into its regulations. Green Button / ESPI is

    NAESB Retail Electric Quadrant Book 21 — a RETAIL standard. FERC has no

    retail jurisdiction, has not adopted Green Button, and mandates nothing about

    customer usage data. No cdr-energy, no green-button-ontario, no

    green-button-voluntary, no smart-meter-infrastructure regime applies here.

    '
  mandateStatus: live-implemented
  mandateStatusEvidence: 'The mandate FERC issues is verifiably implemented, and

    the implementation was probed, not assumed:

    - https://ecollection.ferc.gov/ (FERC eForms XBRL portal) returned HTTP 200
      on 2026-07-27.

    - POST https://ecollection.ferc.gov/api/token with grant_type=password and
      role=filer but no valid credentials returned HTTP 400 with the JSON body
      {"error":"Failed validating user in company registration"} — a live
      authorization server rejecting an unregistered filer, not a marketing page.

    - POST https://ecollection.ferc.gov/api/SubmissionHistory/ExternalFiling is
      documented in FERC''s own downloadable Postman collection (harvested).

    - https://eqrreportviewer.ferc.gov/ (EQR Report Viewer) returned HTTP 200.

    - The outputs of the mandate are published: FERC Form No. 552 and the
      Market-Based Rate Database appear as data assets in the anonymously
      browsable Data Catalog at https://data.ferc.gov/datacatalog/ (HTTP 200).

    NOTHING here is a claim taken on trust. Equally, nothing here is a consumer

    data right — see consumerVsMarketData below.

    '
  consumerDataApi: false
  consumerDataEvidence: 'No consumer or customer-level data API exists at FERC. No

    Green Button endpoint, no ESPI resource tree, no Download My Data, no Connect

    My Data, no OAuth consent flow for customer usage, no accredited-recipient

    register. This is not an omission — FERC regulates wholesale interstate

    transmission and sales, licenses hydropower, and oversees ISO/RTO markets;

    retail service and retail customer data are state PUC jurisdiction. Probed

    and found absent: no consumer-data references anywhere under

    https://data.ferc.gov/datacatalog/ (7 data assets, all corporate/market/

    regulatory), and the Data Catalog industry filters are Natural Gas, Oil,

    Electric, and Hydropower — there is no residential or customer category.

    '
  marketDataOpen: true
  marketDataEvidence: 'FERC publishes genuinely open market and regulatory data.

    The Data Catalog at https://data.ferc.gov/datacatalog/ is browsable

    anonymously (HTTP 200) and lists 7 data assets: Annual Charges, Company

    Registration, FERC Form 556 (Certification of Qualifying Facility Status),

    FERC Information Collections Management, Form No. 552 (natural gas

    transactions), the Market-Based Rate Database, and the NEPA Schedule for

    Pending Infrastructure Projects. The same data is retrievable programmatically

    through the Open Data API with a free key. EQR wholesale transaction data is

    separately downloadable through https://eqrreportviewer.ferc.gov/ (HTTP 200),

    which is a web report viewer with bulk download — probing

    https://eqrreportviewer.ferc.gov/api returned HTTP 404, so there is NO EQR

    API. eLibrary (https://elibrary.ferc.gov/eLibrary/, HTTP 200) is likewise web

    only: /eLibrary/v3/api-docs and /eLibrary/swagger-ui.html both return HTTP 200

    but serve the Angular SPA shell, not a spec. The only official public API is

    the data.ferc.gov one.

    '
  consumerVsMarketDataSplit: 'The split at FERC is total and structural. Market

    data: open, catalogued, documented, API-accessible with a free self-serve key.

    Consumer data: does not exist and cannot exist within FERC''s statutory reach.

    A regulator that publishes a cleanly documented, rate-limited, OpenAPI-described

    public API while the retail utilities under state jurisdiction publish nothing

    comparable is the recurring finding of this series, and FERC is another

    instance of it.

    '
  dataStandard: 'XBRL (FERC eForms taxonomies, Release 2.0 codesets) for the mandated

    filings; NAESB WGQ/WEQ wholesale business practice standards incorporated by

    reference into FERC regulations. NO Green Button / ESPI (that is NAESB REQ

    Book 21, retail, outside FERC jurisdiction). The Open Data API itself follows

    no energy data standard — its payloads are a generic proprietary

    data-asset / dataset / row shape with no CIM, no IEEE 2030.5, no OpenADR, no

    OCPP/OCPI.

    '
  accessGate: self-serve
  accessGateSteps: 'For the Open Data API a developer: (1) reads the Disclaimer /

    Terms of Use at https://data.ferc.gov/disclaimer/; (2) completes the sign-up

    form at https://data.ferc.gov/developer/gettingstarted/sign-up-form/; (3)

    receives a unique 40-character API key by email — FERC''s own wording is

    "After submitting the form, you will receive an email containing your unique

    40-character API key", i.e. automated issuance, no review board, no

    accreditation, no licence signature, no fee; (4) authorizes on

    https://data.ferc.gov/developer/apiendpoints/ or sends the key directly. There

    is no organizational eligibility test. For the eForms XBRL Submission API the

    gate is entirely different and much harder: the filer must hold FERC

    eRegistration credentials AND be authorized under a company''s FERC Company

    Registration (https://www.ferc.gov/company-registration) as an eligible filer

    for that CID. That is customer-account-required in practice and is a write

    path only.

    '
  authModel: 'Open Data API — API key. Two accepted transports, both documented:

    the recommended HTTP header X-Api-Key, and the query parameter api_key. The

    published OpenAPI declares only the query form

    (securitySchemes.ApiKeyQueryAuth: {type: apiKey, in: query, name: api_key}),

    so the spec under-describes the documented header method. Rate limit 1,000

    requests/hour rolling, exposed via X-RateLimit-Limit and X-RateLimit-Remaining

    response headers. Platform is api.data.gov API Umbrella (x-api-umbrella-request-id

    header observed) on cloud.gov (x-vcap-request-id observed).

    eForms Submission API — OAuth2 Resource Owner Password Credentials grant

    (grant_type=password, role=filer) at POST https://ecollection.ferc.gov/api/token,

    returning a bearer token used on the filing POST. No mTLS, no client

    certificates, no accreditation regime.

    OpenID Connect — none served. https://www.ferc.gov/.well-known/openid-configuration

    returned HTTP 404; https://data.ferc.gov/.well-known/openid-configuration

    returned HTTP 404; https://ecollection.ferc.gov/.well-known/openid-configuration

    returned HTTP 200 but served the Angular SPA HTML shell, not JSON — NOT a

    discovery document.

    '
