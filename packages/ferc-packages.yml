summary: FERC publishes no client libraries in any language. Registries probed on 2026-07-27 — npm, PyPI, Maven Central, NuGet,
  pkg.go.dev, RubyGems, Packagist and crates.io — returned nothing first-party, and FERC has no GitHub organisation. The community
  has filled the gap, notably Catalyst Cooperative's PUDL project, which extracts and normalises FERC XBRL filings. FERC's
  own substitute for an SDK is the code-snippet generator in its Swagger console (Python, JavaScript, Java, curl), which emits
  per-endpoint request code after you authorise a key.
