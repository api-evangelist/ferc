versioning:
  - api: ferc:ferc-open-data-api
    scheme: uri-path
    current: v1
    base: https://api.data.ferc.gov/v1
    policy_url: null
    note: >-
      No published versioning policy, no version-negotiation header, no changelog. v1 is the only
      version ever observed. FERC's own OpenAPI carries no `info.version` field.
  - api: ferc:ferc-eforms-xbrl-submission-api
    scheme: none
    current: null
    base: https://ecollection.ferc.gov/api
    note: >-
      The HTTP API is unversioned. The versioned artefact is the XBRL taxonomy: each release is dated
      YYYY-MM-DD and bound to an explicit reporting window (startYear/startPeriod to
      endYear/endPeriod). Filings are validated against the taxonomy in force for the reporting
      period, which is a stricter and more legible contract than the REST surface.
deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation policy, no RFC 8594 Sunset or Deprecation header support on either API. The
    closest thing FERC publishes is the taxonomy end-of-window: a taxonomy version carries an
    endYear/endPeriod after which it no longer applies, and the superseding version's window begins.
    That is a data-contract retirement schedule, not an API deprecation policy.
  taxonomy_windows_example:
    - form: Form 1
      version: '2025-04-01'
      applies: 2025 Q1 through 2025 Q4
      superseded_by: '2026-04-01'
