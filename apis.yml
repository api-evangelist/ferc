apis:
- aid: ferc:ferc-open-data-api
  name: FERC Open Data API
  description: FERC's public open data API, serving the same data assets and datasets
    published in the data.ferc.gov Data Catalog. A Data-Assets endpoint returns the
    catalog and the dataset IDs; Details, Data, and Dictionary endpoints return per-dataset
    metadata, full row data, and column definitions. Free self-serve API key, 1,000
    requests per hour, X-Api-Key header or api_key query parameter. Runs on the api.data.gov
    API Umbrella stack (x-api-umbrella-request-id) hosted on cloud.gov. Verified live
    2026-07-27 — an unauthenticated GET returns HTTP 403 with API_KEY_MISSING and a
    bogus key returns HTTP 403 with API_KEY_INVALID.
  humanURL: https://data.ferc.gov/developer/gettingstarted/
  baseURL: https://api.data.ferc.gov/v1
