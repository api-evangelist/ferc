x-artifacts-note: >-
  No WellKnown pointer and no MCPServer pointer are wired for FERC on purpose. FERC serves no
  /.well-known/ document on any host (twenty probes, 2026-07-27 — see well-known/ferc-well-known.yml)
  and publishes no MCP server (mcp/ferc-mcp.yml is a candidate tool surface only). Both artifacts
  record the absence; neither claims a capability FERC does not have.
