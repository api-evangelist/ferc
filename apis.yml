aid: ferc
url: https://raw.githubusercontent.com/api-evangelist/ferc/refs/heads/main/apis.yml
name: FERC
kind: company
description: The Federal Energy Regulatory Commission (FERC) is the independent United
  States federal agency that regulates the interstate transmission of electricity,
  natural gas, and oil, licenses hydropower projects, and oversees the wholesale power
  markets run by the seven ISOs and RTOs. FERC sits on the wholesale side of the US
  energy value chain — it does not regulate retail utility service, retail rates, or
  the customer relationship, which remain with the fifty state public utility commissions.
  That jurisdictional line defines FERC's API posture exactly. FERC operates a real,
  self-serve open data API at api.data.ferc.gov, documented at data.ferc.gov with a
  published OpenAPI 3.0 description, a free 40-character API key issued from a sign-up
  form, a 1,000-request-per-hour rate limit, and X-Api-Key header or api_key query
  authentication on the api.data.gov API Umbrella stack — genuinely open market and
  regulatory data covering the Market-Based Rate Database, FERC Form No. 552 natural
  gas transactions, FERC Form 556 qualifying facility certifications, Company Registration,
  Annual Charges, Information Collections Management, and the NEPA infrastructure
  schedule. FERC also runs a credentialed OAuth2 XBRL submission API at ecollection.ferc.gov
  for the mandated eForms filings (Form Nos. 1, 2, 3-Q, 6, 60, 552, 714). What FERC
  does NOT do is any part of consumer energy data — there is no Green Button, no ESPI,
  no consumer data right, and no individual customer usage or billing API anywhere
  in FERC's surface, because retail customer data is outside its statutory reach.
  FERC is therefore an open-market-data, zero-consumer-data regulator, and it publishes
  a better documented API than most of the utilities it indirectly touches.
