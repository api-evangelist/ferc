- aid: ferc:ferc-eforms-xbrl-submission-api
  name: FERC eForms XBRL Submission API
  description: The machine-to-machine filing API for FERC's mandated eForms. Credentialed
    filers exchange their FERC eRegistration and Company Registration username and
    password for a bearer token at POST /api/token (OAuth2 password grant, role=filer),
    then POST a zipped XBRL submission to /api/SubmissionHistory/ExternalFiling with
    the company CID, report year, report period, and form identifier. This is a write
    API for regulated filers, not a read API for developers — there is no public data
    retrieval surface here. Verified live 2026-07-27 — POST /api/token without valid
    credentials returns HTTP 400 with "Failed validating user in company registration".
  humanURL: https://www.ferc.gov/vendor-files-library
